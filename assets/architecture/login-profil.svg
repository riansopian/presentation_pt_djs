<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" width="740" height="480" role="img" aria-labelledby="diagram-title"><title id="diagram-title">Alur login Keycloak dan pemuatan profil</title><style>:root{--ink:#0f172a;--muted:#475569;--red:#e11d48;--amber:#a16207;--line:#e2e8f0}
.lt,.lt2,.lw,.lws,.ls,.lr,.cap,.lchip{font-family:'Segoe UI',system-ui,Arial,sans-serif}
.lt{font-size:17px;font-weight:650;fill:var(--ink)}
.lt2{font-size:14.5px;font-weight:650;fill:var(--ink)}
.ls{font-size:14px;font-weight:500;fill:var(--muted)}
.lw{font-size:18px;font-weight:700;fill:#fff}
.lws{font-size:14px;font-weight:500;fill:#fff}
.lr{font-size:15px;font-weight:700;fill:#be123c}
.cap{font-size:12.5px;font-weight:700;letter-spacing:.09em;fill:var(--muted)}
.lchip{font-size:12.5px;font-weight:600;fill:var(--ink)}
.mono{font:500 13.5px Consolas,monospace;fill:var(--muted)}
.ln{stroke:#5a5d63;stroke-width:2;fill:none}
.lnr{stroke:var(--red);stroke-width:2.4;fill:none}
.lnd{stroke:#8a8d93;stroke-width:1.8;fill:none;stroke-dasharray:6 5}
.lna{stroke:var(--amber);stroke-width:2;fill:none}
.life{stroke:var(--line);stroke-width:2;stroke-dasharray:3 6}
