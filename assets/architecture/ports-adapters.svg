<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" width="740" height="470" role="img" aria-labelledby="diagram-title"><title id="diagram-title">Ports dan adapter di layanan dan Event Core</title><style>:root{--ink:#0f172a;--muted:#475569;--red:#e11d48;--amber:#a16207;--line:#e2e8f0}
.lt,.lt2,.lw,.lws,.ls,.lr,.cap,.lchip{font-family:'Segoe UI',system-ui,Arial,sans-serif}
