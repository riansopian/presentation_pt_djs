  <style>
    :root {
      --background: 210 20% 98%;
      --foreground: 222 47% 11%;
      --primary: 346.8 77.2% 49.8%;
    }

    }
    code, pre, .font-mono {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    }

    /* Booket Shimmer Animation (from globals.css) */
    @keyframes shimmer-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .animate-shimmer {
      animation: shimmer-slide 1.8s ease-in-out infinite;
    }

    /* Slide Directional Entrance Transitions */
    .slide-enter-next {
      animation: enterFromRight 0.34s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .slide-enter-prev {
      animation: enterFromLeft 0.34s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes enterFromRight {
      from { opacity: 0; transform: translateX(22px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes enterFromLeft {
      from { opacity: 0; transform: translateX(-22px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Staggered Item Entrance */
    .stagger-1 { animation: itemFade 0.38s 0.04s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stagger-2 { animation: itemFade 0.38s 0.09s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stagger-3 { animation: itemFade 0.38s 0.14s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stagger-4 { animation: itemFade 0.38s 0.19s cubic-bezier(0.16, 1, 0.3, 1) both; }

    @keyframes itemFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Booket Soft Card Hover */
    .booket-card {
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .booket-card:hover {
      border-color: #fda4af;
      box-shadow: 0 10px 24px -8px rgba(225, 29, 72, 0.1);
      transform: translateY(-1px);
    }

    /* Booket Ticket Notch Effect */
    .ticket-cutout-left {
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      background-color: #ffffff;
      border-right: 1px solid #e2e8f0;
      z-index: 10;
    }

      position: absolute;
      right: -12px;

      height: 24px;
      border-radius: 9999px;
      background-color: #ffffff;
      border-left: 1px solid #e2e8f0;
      z-index: 10;

              </div>
              <div class="p-3 rounded-2xl bg-rose-50 border border-rose-200">
                <div class="font-black text-rose-700">1 NIK = 1 Tiket</div>
                <div class="text-[10px] text-rose-600 mt-0.5">Maks 3 / Order</div>
              </div>
              <div class="p-3 rounded-2xl bg-slate-100 border border-slate-200">
                <div class="font-black text-slate-900">666 Tests</div>
                <div class="text-[10px] text-slate-600 mt-0.5">6-Stage CI/CD</div>
              </div>
              <div class="p-3 rounded-2xl bg-amber-50 border border-amber-200">
                <div class="font-black text-amber-800">US$7.200 PoC</div>
                <div class="text-[10px] text-amber-700 mt-0.5">Fallback $8.400</div>
              </div>
            </div>

            <div class="text-slate-500 font-medium pt-1 text-xs stagger-3">
              Kami mengundang bapak/ibu panel penilai untuk masuk ke sesi Live Demo &amp; diskusi tanya jawab.
            </div>
          </div>
        `,
        notes: "Sebagai penutup, kami merekomendasikan langkah berikutnya: meninjau envelope PoC US$7.200 (dengan fallback US$8.400), melengkapi validasi invoice & quote vendor di minggu pertama, dan memulai pengujian baseline agar konfigurasi produksi nantinya betul-betul berdasar pengukuran riil. Terima kasih, mari kita lanjutkan ke demo dan tanya jawab."
      }
    ];

    let current = 0;
    let showNotes = true;
    let direction = 'next';

    const slideContentArea = document.getElementById('slideContentArea');
    const notesContentText = document.getElementById('notesContentText');
    const notesDrawer = document.getElementById('notesDrawer');
    const slideIndexText = document.getElementById('slideIndexText');
    const totalSlideText = document.getElementById('totalSlideText');
    const prevSlideBtn = document.getElementById('prevSlideBtn');
    const nextSlideBtn = document.getElementById('nextSlideBtn');
    const toggleNotesBtn = document.getElementById('toggleNotesBtn');
    const notesStatusText = document.getElementById('notesStatusText');
    const notesDot = document.getElementById('notesDot');
    const progressBar = document.getElementById('progressBar');
    const slideDotsArea = document.getElementById('slideDotsArea');
    const chapterNav = document.getElementById('chapterNav');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    totalSlideText.innerText = deck.length;

    const chapters = [];
    deck.forEach((s, idx) => {
      if (!chapters.some(c => c.name === s.chapter)) {
        chapters.push({ name: s.chapter, startIndex: idx });
      }
    });

    function renderChapterPills(activeChapter) {
      chapterNav.innerHTML = '';
      chapters.forEach((ch) => {
        const btn = document.createElement('button');
        const isActive = ch.name === activeChapter;
        btn.className = isActive
          ? 'rounded-full px-3 py-1 bg-rose-600 text-white shadow-sm shadow-rose-600/30 transition-all'
          : 'rounded-full px-3 py-1 text-slate-600 hover:text-slate-950 hover:bg-slate-100 transition-all';
        btn.innerText = ch.name;
        btn.addEventListener('click', () => {
          direction = ch.startIndex >= current ? 'next' : 'prev';
          current = ch.startIndex;
          renderSlide(current);
        });
        chapterNav.appendChild(btn);
      });
    }

    deck.forEach((_, idx) => {
      const dot = document.createElement('button');
      dot.className = `h-1.5 rounded-full transition-all duration-200 ${idx === 0 ? 'bg-rose-600 w-5' : 'bg-slate-300 hover:bg-slate-400 w-2'}`;
      dot.title = `Slide ${idx + 1}`;
      dot.addEventListener('click', () => {
        direction = idx > current ? 'next' : 'prev';
        current = idx;
        renderSlide(current);
      });
      slideDotsArea.appendChild(dot);
    });

    function updateDots(index) {
      const dots = slideDotsArea.querySelectorAll('button');
      dots.forEach((dot, idx) => {
        if (idx === index) {
          dot.className = 'h-1.5 rounded-full bg-rose-600 w-5 transition-all duration-200 shadow-xs';
        } else {
          dot.className = 'h-1.5 rounded-full bg-slate-300 hover:bg-slate-400 w-2 transition-all duration-200';
        }
      });
    }

    function renderSlide(index) {
      const s = deck[index];
      slideIndexText.innerText = index + 1;

      const percent = ((index + 1) / deck.length) * 100;
      progressBar.style.width = `${percent}%`;

      updateDots(index);
      renderChapterPills(s.chapter);

      const animClass = direction === 'next' ? 'slide-enter-next' : 'slide-enter-prev';

      slideContentArea.innerHTML = `
        <div class="${animClass} flex-1 flex flex-col justify-between">
          <div class="mb-4 pb-3 border-b border-slate-100">
            <div class="text-[10px] font-mono tracking-wider font-bold text-rose-600 mb-1 flex items-center gap-2">
              <span class="size-1.5 rounded-full bg-rose-600"></span>
              <span>${s.tag}</span>
            </div>
            <h2 class="text-xl sm:text-2xl font-black text-slate-950 tracking-tight">${s.title}</h2>
            <p class="text-xs text-slate-500 mt-1 font-medium">${s.subtitle}</p>
          </div>
          <div class="min-h-[300px] flex flex-col justify-center my-auto">
            ${s.content}
          </div>
        </div>
      `;

      notesContentText.innerText = `"${s.notes}"`;

      prevSlideBtn.disabled = index === 0;
      nextSlideBtn.disabled = index === deck.length - 1;
    }

    prevSlideBtn.addEventListener('click', () => {
      if (current > 0) {
        direction = 'prev';
        current--;
        renderSlide(current);
      }
    });

    nextSlideBtn.addEventListener('click', () => {
      if (current < deck.length - 1) {
        direction = 'next';
        current++;
        renderSlide(current);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        if (current < deck.length - 1) {
          direction = 'next';
          current++;
          renderSlide(current);
        }
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        if (current > 0) {
          direction = 'prev';
          current--;
          renderSlide(current);
        }
      } else if (e.key === 'n' || e.key === 'N') {
        toggleNotes();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    function toggleNotes() {
      showNotes = !showNotes;
      if (showNotes) {
        notesDrawer.style.display = 'block';
        notesStatusText.innerText = 'ON';
        notesDot.className = 'size-1.5 rounded-full bg-rose-600';
      } else {
        notesDrawer.style.display = 'none';
        notesStatusText.innerText = 'OFF';
        notesDot.className = 'size-1.5 rounded-full bg-slate-400';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    toggleNotesBtn.addEventListener('click', toggleNotes);
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    renderSlide(0);
  </script>
</body>
</html>
