                <div class="font-bold text-blue-400">Anti-PHP</div>
                <div class="text-[10px] text-slate-500 mt-0.5">Two-Tier Server TTL</div>
              </div>
            </div>

            <div class="text-slate-400 pt-2 text-xs stagger-3">
              Kami siap menjawab seluruh pertanyaan dan telaah teknis mendalam dari bapak/ibu tim penilai.
            </div>
          </div>
        `,
        notes: "Sebagai penutup, kami di PT DJS menegaskan kesiapan penuh kami untuk mendampingi Telkomsel mulai dari load testing gabungan hingga pendampingan on-site di hari-H konser. Terima kasih atas perhatian bapak dan ibu sekalian, mari kita buka sesi tanya jawab teknis."
      }
    ];

    let current = 0;
    let showNotes = true;
    let direction = 'next';

    const slideContentArea = document.getElementById('slideContentArea');
    const notesContentText = document.getElementById('notesContentText');
    const notesDrawer = document.getElementById('notesDrawer');
    const slideIndexText = document.getElementById('slideIndexText');
    const totalSlideText = document.getElementById('totalSlideText');
    const prevSlideBtn = document.getElementById('prevSlideBtn');
    const nextSlideBtn = document.getElementById('nextSlideBtn');
    const toggleNotesBtn = document.getElementById('toggleNotesBtn');
    const notesStatusText = document.getElementById('notesStatusText');
    const progressBar = document.getElementById('progressBar');
    const slideDotsArea = document.getElementById('slideDotsArea');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    totalSlideText.innerText = deck.length;

    // Create minimal dot pills
    deck.forEach((_, idx) => {
      const dot = document.createElement('button');
      dot.className = `h-1.5 rounded-full transition-all duration-200 ${idx === 0 ? 'bg-rose-500 w-5' : 'bg-white/10 hover:bg-white/25 w-2'}`;
      dot.title = `Slide ${idx + 1}`;
      dot.addEventListener('click', () => {
        direction = idx > current ? 'next' : 'prev';
        current = idx;
        renderSlide(current);
      });
      slideDotsArea.appendChild(dot);
    });

    function updateDots(index) {
      const dots = slideDotsArea.querySelectorAll('button');
      dots.forEach((dot, idx) => {
        if (idx === index) {
          dot.className = 'h-1.5 rounded-full bg-rose-500 w-5 transition-all duration-200';
        } else {
          dot.className = 'h-1.5 rounded-full bg-white/10 hover:bg-white/25 w-2 transition-all duration-200';
        }
      });
    }

    function renderSlide(index) {
      const s = deck[index];
      slideIndexText.innerText = index + 1;
      
      const percent = ((index + 1) / deck.length) * 100;
      progressBar.style.width = `${percent}%`;

      updateDots(index);

      const animClass = direction === 'next' ? 'slide-enter-next' : 'slide-enter-prev';
      
      slideContentArea.innerHTML = `
        <div class="${animClass} flex-1 flex flex-col justify-between">
          <div class="mb-4">
            <div class="text-[10px] font-mono tracking-wider font-semibold text-rose-400 mb-1 flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
              <span>${s.tag}</span>
            </div>
            <h2 class="text-xl sm:text-2xl font-bold text-white tracking-tight">${s.title}</h2>
            <p class="text-xs text-slate-400 mt-1">${s.subtitle}</p>
          </div>
          <div class="min-h-[300px] flex flex-col justify-center my-auto">
            ${s.content}
          </div>
        </div>
      `;

      notesContentText.innerText = `"${s.notes}"`;
      
      prevSlideBtn.disabled = index === 0;
      nextSlideBtn.disabled = index === deck.length - 1;
    }

    prevSlideBtn.addEventListener('click', () => {
      if (current > 0) {
        direction = 'prev';
        current--;
        renderSlide(current);
      }
    });

    nextSlideBtn.addEventListener('click', () => {
      if (current < deck.length - 1) {
        direction = 'next';
        current++;
        renderSlide(current);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        if (current < deck.length - 1) {
          direction = 'next';
          current++;
          renderSlide(current);
        }
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        if (current > 0) {
          direction = 'prev';
          current--;
          renderSlide(current);
        }
      } else if (e.key === 'n' || e.key === 'N') {
        toggleNotes();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    function toggleNotes() {
      showNotes = !showNotes;
      if (showNotes) {
        notesDrawer.style.display = 'block';
        notesStatusText.innerText = 'ON';
        notesStatusText.className = 'text-rose-400 font-bold';
      } else {
        notesDrawer.style.display = 'none';
        notesStatusText.innerText = 'OFF';
        notesStatusText.className = 'text-slate-500 font-bold';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    toggleNotesBtn.addEventListener('click', toggleNotes);
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // Initial render
    renderSlide(0);
  </script>
</body>
</html>
